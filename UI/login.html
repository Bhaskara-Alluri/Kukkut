<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Kukkut Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- CSS -->
  <link href="/ui/styles.css" rel="stylesheet" />

  <!-- Config + main login script -->
  <script defer src="/ui/config.js"></script>
  <script type="module" src="/ui/login.js"></script>
</head>

<body class="login-layout">
  <div class="login-container">

    <!-- LEFT SIDE -->
    <div class="login-left">
      <div class="brand-box">
        <img src="/ui/assets/kukkut-logo.png" alt="Kukkut Logo" class="logo-large" />
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="login-right">
      <form id="loginForm" class="auth-card">
        <h2 class="login-title">Sign In</h2>

        <label>User Name
          <input type="text" id="username" />
        </label>

        <label>Password
          <div class="password-wrap">
            <input id="password" type="password" autocomplete="current-password" required minlength="6" />
            <button type="button" id="togglePw" class="linklike">Show</button>
          </div>
        </label>

        <div class="link-row">
          <a href="#" class="forgot-link">Forgot Password?</a>
          <a href="#" class="signup-link">Sign Up</a>
        </div>

        <button type="submit">Sign In</button>
        <p id="msg" class="msg"></p>
      </form>
    </div>
  </div>
</body>

</html>
